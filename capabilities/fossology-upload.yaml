        - name: assignee
          in: query
          type: integer
          description: New assignee for the project
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: moveuploadbyid
        method: PUT
        description: Copy/Move an upload
        outputRawFormat: json
        outputParameters:
