aid: fossology
name: FOSSology
description: >-
  FOSSology is a Linux Foundation project providing open source license compliance software that scans source code for
  licenses, copyrights, and export control information. It helps organizations manage their open source license
  obligations through automated scanning, human clearing workflows, and SPDX/compliance reporting via a self-hosted REST
  API.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/fossology.png
tags:
  - Compliance
  - Licensing
  - Linux Foundation
  - Scanning
  - SPDX
  - Open Source
created: '2026-03-16'
